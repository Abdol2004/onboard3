<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="medal-gradient-quest_5" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)" />
            <stop offset="50%" style="stop-color:#39FF14" />
            <stop offset="100%" style="stop-color:rgba(0,0,0,0.8)" />
        </radialGradient>
        <filter id="shadow-quest_5">
            <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.5"/>
