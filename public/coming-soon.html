<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — ONBOARD3</title>
  <script>
    // If bypass cookie already set (e.g. user revisits after /home), go straight to the site
    if (document.cookie.split(';').some(function(c){ return c.trim() === '_ob3_access=1'; })) {
      window.location.replace('/');
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-light: #8fff3a;
      --green-mid:   #4cde1a;
      --green-dark:  #1a8f2a;
    }

    body {
      min-height: 100vh;
      background: #000;
      font-family: 'Inter', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ambient glow blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: var(--green-mid);
      top: -150px; left: -150px;
    }
    body::after {
      width: 500px; height: 500px;
      background: var(--green-dark);
      bottom: -120px; right: -120px;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 640px;
      width: 100%;
    }

    /* logo */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .logo-wrap img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 30px rgba(76, 222, 26, 0.5));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    /* pill badge */
    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(76, 222, 26, 0.4);
      background: rgba(76, 222, 26, 0.08);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--green-mid);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 40%, var(--green-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      font-size: 1.05rem;
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      line-height: 1.7;
      margin-bottom: 2.8rem;
    }

    /* countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    .cd-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(76, 222, 26, 0.18);
      border-radius: 16px;
      padding: 1.1rem 1.4rem;
      min-width: 78px;
      backdrop-filter: blur(8px);
    }
    .cd-num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--green-light);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .cd-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-top: 0.4rem;
    }

    /* notify form */
    .notify-form {
      display: flex;
      gap: 0.6rem;
      max-width: 420px;
      margin: 0 auto 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .notify-form input[type="email"] {
      flex: 1 1 220px;
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      border: 1px solid rgba(76, 222, 26, 0.25);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .notify-form input[type="email"]::placeholder { color: rgba(255,255,255,0.3); }
    .notify-form input[type="email"]:focus { border-color: var(--green-mid); }

    .notify-form button {
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--green-mid), var(--green-dark));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 24px rgba(76, 222, 26, 0.3);
    }
    .notify-form button:hover { opacity: 0.9; transform: translateY(-1px); }
    .notify-form button:active { transform: scale(0.97); }

    .thanks {
      display: none;
      color: var(--green-light);
      font-weight: 600;
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }

    /* social links */
    .socials {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      font-size: 1rem;
    }
    .socials a:hover {
      border-color: var(--green-mid);
      color: var(--green-mid);
      background: rgba(76, 222, 26, 0.08);
    }
    .socials svg { width: 18px; height: 18px; fill: currentColor; }

    /* particle dots */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .dot {
      position: absolute;
      border-radius: 50%;
      background: var(--green-mid);
      opacity: 0;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-100vh) scale(0.4); }
    }
  </style>
</head>
<body>

  <!-- particles -->
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="logo-wrap">
      <!-- inline SVG recreation of the logo using the brand colours -->
      <img src="img/logo.png" alt="Onboarder logo" onerror="this.style.display='none'; document.getElementById('svg-logo').style.display='block';" />
      <svg id="svg-logo" style="display:none; width:120px; height:120px;" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8fff3a"/>
            <stop offset="100%" stop-color="#1a8f2a"/>
          </linearGradient>
        </defs>
        <!-- simplified circular blob emblem -->
        <circle cx="100" cy="100" r="95" fill="url(#g1)" opacity="0.15"/>
        <path d="M70 55 Q55 80 70 100 Q85 120 100 105 Q115 90 130 100 Q145 110 140 135 Q135 160 110 155 Q85 150 75 130 Q65 110 80 95 Q95 80 85 65 Z"
              fill="url(#g1)" opacity="0.9"/>
        <circle cx="130" cy="65" r="18" fill="url(#g1)" opacity="0.85"/>
        <circle cx="68" cy="148" r="14" fill="url(#g1)" opacity="0.75"/>
      </svg>
    </div>

    <div class="badge">We'll be back</div>

    <h1>Something big<br/>is coming.</h1>

    <p class="sub">
      We're putting the finishing touches on something exciting.<br/>
      Drop your email and be the first to know when we launch.
    </p>

    <!-- countdown to a launch date – set your target below -->
    <div class="countdown">
      <div class="cd-box"><span class="cd-num" id="cd-days">00</span><span class="cd-label">Days</span></div>
      <div class="cd-box"><span class="cd-num" id="cd-hours">00</span><span class="cd-label">Hours</span></div>
      <div class="cd-box"><span class="cd-num" id="cd-mins">00</span><span class="cd-label">Mins</span></div>
      <div class="cd-box"><span class="cd-num" id="cd-secs">00</span><span class="cd-label">Secs</span></div>
    </div>

    <!-- <form class="notify-form" id="notifyForm">
      <input type="email" placeholder="Enter your email address" required />
      <button type="submit">Notify Me</button>
    </form> -->
    <p class="thanks" id="thanks">Thanks! We'll notify you at launch.</p>

    <div class="socials">
      <!-- X / Twitter -->
      <a href="https://x.com/onboard3___" title="Twitter / X">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.629 5.905-5.629Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <!-- Telegram -->
      <a href="https://t.me/onboard_3" title="Telegram">
        <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 1 0 24 12 12 12 0 0 0 11.944 0zm6.113 8.107-2.01 9.476c-.148.664-.537.826-1.088.512l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.214-3.054 5.56-5.022c.242-.213-.053-.33-.373-.117L6.832 14.37l-2.953-.923c-.64-.2-.652-.64.135-.95l11.528-4.443c.533-.194 1 .13.515 1.053z"/></svg>
      </a>
    </div>
  </div>

  <script>
    // ── Countdown ────────────────────────────────────────────────
    // Set your target launch date here (ISO format, local time)
    const LAUNCH = new Date('2026-07-02T00:00:00');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const diff = LAUNCH - Date.now();
      if (diff <= 0) {
        document.querySelector('.countdown').style.display = 'none';
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById('cd-days').textContent  = pad(d);
      document.getElementById('cd-hours').textContent = pad(h);
      document.getElementById('cd-mins').textContent  = pad(m);
      document.getElementById('cd-secs').textContent  = pad(s);
    }
    tick();
    setInterval(tick, 1000);

    // ── Notify form ──────────────────────────────────────────────
    var _nf = document.getElementById('notifyForm');
    if (_nf) _nf.addEventListener('submit', function(e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
    });

    // ── Floating particles ───────────────────────────────────────
    const container = document.getElementById('particles');
    for (let i = 0; i < 28; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      const size = Math.random() * 4 + 2;
      dot.style.cssText = [
        'left:'+ (Math.random()*100) +'%',
        'bottom:'+ (Math.random()*-20) +'%',
        'width:'+ size +'px',
        'height:'+ size +'px',
        'animation-duration:'+ (Math.random()*12+8) +'s',
        'animation-delay:'+ (Math.random()*10) +'s'
      ].join(';');
      container.appendChild(dot);
    }
  </script>
</body>
</html>
